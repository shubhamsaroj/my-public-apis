<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://photon.komoot.io https://api.open-meteo.com https://air-quality-api.open-meteo.com https://geocoding-api.open-meteo.com https://nominatim.openstreetmap.org; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b1430">
<meta name="format-detection" content="telephone=no">
<title>Weatherwise</title>
<link rel="icon" href="data:,">
<link rel="preload" href="fonts/outfit.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body data-view="none">

<svg class="svg-defs" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="g-sun-core" cx="40%" cy="38%" r="70%">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset=".45" stop-color="#ffd84a"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </radialGradient>
    <radialGradient id="g-sun-glow">
      <stop offset="0" stop-color="#ffd25a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd25a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset="1" stop-color="#e2d7ad"/>
    </linearGradient>
    <radialGradient id="g-moon-glow">
      <stop offset=".55" stop-color="#dfe6ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#dfe6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7e1f0"/>
    </linearGradient>
    <linearGradient id="g-cloud-night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6ecf8"/>
      <stop offset="1" stop-color="#a9b6cf"/>
    </linearGradient>
    <linearGradient id="g-cloud-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd7e5"/>
      <stop offset="1" stop-color="#8d99b0"/>
    </linearGradient>
    <linearGradient id="g-cloud-storm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a2abc0"/>
      <stop offset="1" stop-color="#5b6580"/>
    </linearGradient>
    <linearGradient id="g-bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6a8"/>
      <stop offset="1" stop-color="#ffb21e"/>
    </linearGradient>
  </defs>
</svg>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="sky-shade" id="sky-shade" aria-hidden="true"></div>

<div class="ptr" id="ptr" aria-hidden="true">
  <svg viewBox="0 0 40 40"><circle class="ptr-track" cx="20" cy="20" r="13"/><circle class="ptr-arc" id="ptr-arc" cx="20" cy="20" r="13" pathLength="100"/></svg>
</div>

<header class="topbar" id="topbar">
  <div class="topbar-bg" aria-hidden="true"></div>
  <button class="icon-btn" id="btn-places" type="button" aria-label="Locations"></button>
  <div class="topbar-title" aria-hidden="true"><span id="tb-name"></span><span id="tb-temp"></span></div>
  <button class="icon-btn" id="btn-settings" type="button" aria-label="Settings"></button>
</header>

<main class="app" id="app">
  <section class="welcome hidden" id="view-welcome" aria-labelledby="welcome-title">
    <div class="welcome-mark" id="welcome-mark" aria-hidden="true"></div>
    <h1 class="welcome-title" id="welcome-title">Weatherwise</h1>
    <p class="welcome-tag">Beautiful, honest weather.<br>No ads. No tracking.</p>
    <div class="welcome-actions">
      <button class="btn btn-primary" id="welcome-locate" type="button">Use my location</button>
      <button class="btn btn-glass" id="welcome-search" type="button">Search for a city</button>
    </div>
    <p class="welcome-note">Your location is only used to fetch the forecast.</p>
  </section>

  <section class="loading hidden" id="view-loading" aria-busy="true" aria-label="Loading forecast">
    <div class="sk sk-hero"></div>
    <div class="sk sk-card"></div>
    <div class="sk sk-card tall"></div>
  </section>

  <section class="error hidden" id="view-error" role="alert">
    <div class="card error-card">
      <span class="error-icon" id="error-icon" aria-hidden="true"></span>
      <h2>Couldn't load the forecast</h2>
      <p id="error-text">Check your internet connection and try again.</p>
      <button class="btn btn-primary" id="error-retry" type="button">Try again</button>
    </div>
  </section>

  <div class="main hidden" id="view-main"></div>
</main>

<!-- Locations -->
<div class="sheet-wrap hidden" id="sheet-places" role="dialog" aria-modal="true" aria-labelledby="places-title">
  <div class="sheet-backdrop"></div>
  <div class="sheet sheet-full">
    <div class="sheet-handle" data-drag><span class="grabber"></span></div>
    <div class="sheet-head" data-drag>
      <h2 class="sheet-title" id="places-title">Locations</h2>
      <button class="text-btn" id="places-edit" type="button">Edit</button>
      <button class="icon-btn small" type="button" data-close aria-label="Close locations"></button>
    </div>
    <div class="search-field">
      <span class="search-icon" id="search-icon" aria-hidden="true"></span>
      <input id="place-search" type="search" inputmode="search" enterkeyhint="search" maxlength="100" placeholder="Search for a city" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" aria-label="Search for a city">
      <button class="icon-btn small invisible" id="place-search-clear" type="button" aria-label="Clear search"></button>
    </div>
    <div class="sheet-body" id="places-body"></div>
  </div>
</div>

<!-- Settings -->
<div class="sheet-wrap hidden" id="sheet-settings" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="sheet-backdrop"></div>
  <div class="sheet sheet-full">
    <div class="sheet-handle" data-drag><span class="grabber"></span></div>
    <div class="sheet-head" data-drag>
      <h2 class="sheet-title" id="settings-title">Settings</h2>
      <button class="icon-btn small" type="button" data-close aria-label="Close settings"></button>
    </div>
    <div class="sheet-body" id="settings-body"></div>
  </div>
</div>

<!-- Temperature alert editor -->
<div class="sheet-wrap hidden" id="sheet-alert" role="dialog" aria-modal="true" aria-labelledby="alert-title">
  <div class="sheet-backdrop"></div>
  <div class="sheet sheet-compact">
    <div class="sheet-handle" data-drag><span class="grabber"></span></div>
    <div class="sheet-head" data-drag>
      <h2 class="sheet-title" id="alert-title">Temperature alert</h2>
      <button class="icon-btn small" type="button" data-close aria-label="Close"></button>
    </div>
    <div class="sheet-body" id="alert-body"></div>
  </div>
</div>

<!-- Alert reliability -->
<div class="sheet-wrap hidden" id="sheet-reliability" role="dialog" aria-modal="true" aria-labelledby="rel-title">
  <div class="sheet-backdrop"></div>
  <div class="sheet sheet-full">
    <div class="sheet-handle" data-drag><span class="grabber"></span></div>
    <div class="sheet-head" data-drag>
      <h2 class="sheet-title" id="rel-title">Make alerts reliable</h2>
      <button class="icon-btn small" type="button" data-close aria-label="Close"></button>
    </div>
    <div class="sheet-body" id="reliability-body"></div>
  </div>
</div>

<!-- Day detail -->
<div class="sheet-wrap hidden" id="sheet-day" role="dialog" aria-modal="true" aria-labelledby="day-title">
  <div class="sheet-backdrop"></div>
  <div class="sheet sheet-full">
    <div class="sheet-handle" data-drag><span class="grabber"></span></div>
    <div class="sheet-head slim" data-drag>
      <span class="sheet-kicker">Daily forecast</span>
      <button class="icon-btn small" type="button" data-close aria-label="Close"></button>
    </div>
    <div class="sheet-body" id="day-body"></div>
  </div>
</div>

<!-- Hour detail -->
<div class="sheet-wrap hidden" id="sheet-hour" role="dialog" aria-modal="true" aria-labelledby="hour-title">
  <div class="sheet-backdrop"></div>
  <div class="sheet sheet-compact">
    <div class="sheet-handle" data-drag><span class="grabber"></span></div>
    <div class="sheet-head slim" data-drag>
      <span class="sheet-kicker">Hourly forecast</span>
      <button class="icon-btn small" type="button" data-close aria-label="Close"></button>
    </div>
    <div class="sheet-body" id="hour-body"></div>
  </div>
</div>

<!-- Metric detail -->
<div class="sheet-wrap hidden" id="sheet-metric" role="dialog" aria-modal="true" aria-labelledby="metric-title">
  <div class="sheet-backdrop"></div>
  <div class="sheet sheet-full">
    <div class="sheet-handle" data-drag><span class="grabber"></span></div>
    <div class="sheet-head slim" data-drag>
      <span class="sheet-kicker">Details</span>
      <button class="icon-btn small" type="button" data-close aria-label="Close"></button>
    </div>
    <div class="sheet-body" id="metric-body"></div>
  </div>
</div>

<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
